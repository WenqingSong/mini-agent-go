# 本地编排：Go API 与 React 前端各一个容器。浏览器记录存本地，无额外数据库。
# 配置全部来自 .env（env_file），镜像内不含任何凭据。
services:
  mini-agent:
    build:
      context: .
    image: mini-agent-go:local

    env_file:
      - .env

    environment:
      # 容器内必须监听所有接口，否则宿主机无法通过端口映射访问；
      # 对外暴露范围由下面的 ports 限制在宿主机回环地址，且应用强制要求 Bearer 凭证。
      MINI_AGENT_LISTEN_ADDR: 0.0.0.0:8080

    ports:
      - "127.0.0.1:${MINI_AGENT_HOST_PORT:-8080}:8080"

    # 应用的优雅关闭宽限期是 10s（MINI_AGENT_SHUTDOWN_GRACE），
    # 留出余量，避免 docker stop 在应用完成在途请求前就 SIGKILL。
    stop_grace_period: 15s

    restart: unless-stopped

  web:
    build:
      context: ./web
    image: mini-agent-web:local
    environment:
      MINI_AGENT_BACKEND_URL: http://mini-agent:8080
      # 仅服务端代理读取；前端构建与浏览器均不接触此凭证或模型 API Key。
      MINI_AGENT_AUTH_TOKEN: ${MINI_AGENT_AUTH_TOKEN:?请先在 .env 中配置 HTTP 凭证}
    ports:
      - "127.0.0.1:${MINI_AGENT_WEB_PORT:-3000}:3000"
    depends_on:
      mini-agent:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped
