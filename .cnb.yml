$:
  vscode:
    - name: goland-dev
      services:
        - vscode
        - docker

      docker:
        image: docker.cnb.cool/arthur-cloud-native/jetbrains/goland:5.0.1

      stages:
        - name: environment-check
          script: |
            go version
            git --version
            docker version
            docker compose version
main:
  pull_request:
    - name: pr-check
      services:
        - docker
      docker:
        image: golang:1.24
        volumes:
          - /go/pkg/mod
          - /root/.cache/go-build
      stages:
        - name: test
          script: make test

  push:
    - name: main-ci-and-github-mirror
      lock:
        key: github-mirror-sync
        wait: true
      services:
        - docker
      docker:
        image: golang:1.24
        volumes:
          - /go/pkg/mod
          - /root/.cache/go-build
      imports:
        - https://cnb.cool/framework-station/mini-agent-go-password/-/blob/main/github-mirror.yml
      stages:
        - name: sync-all-branches-and-tags-to-github
          script: |
            set -euo pipefail

            printf 'machine github.com\nlogin %s\npassword %s\n' \
              "${GITHUB_USERNAME}" "${GITHUB_TOKEN}" > "${HOME}/.netrc"
            chmod 600 "${HOME}/.netrc"
            trap 'rm -f "${HOME}/.netrc"' EXIT

            git fetch origin \
              '+refs/heads/*:refs/remotes/cnb/*' \
              '+refs/tags/*:refs/tags/*' \
              --prune

            git remote remove github-mirror 2>/dev/null || true
            git remote add github-mirror \
              https://github.com/WenqingSong/mini-agent-go

            for ref in $(git for-each-ref \
              --format='%(refname)' refs/remotes/cnb); do
              branch="${ref#refs/remotes/cnb/}"
              if [ "${branch}" = "HEAD" ]; then
                continue
              fi
              echo "Syncing branch: ${branch}"
              git push github-mirror \
                "${ref}:refs/heads/${branch}"
            done

            echo "Syncing tags"
            git push github-mirror --tags