# CNB 云原生构建配置（语法参考 https://docs.cnb.cool/zh/build/grammar.html）。
#
# 触发模型：
#   * 任意分支 push / 任意目标分支的 PR → 检查 Go 与前端构建，不发布任何制品；
#   * 仅 main 的 push → 检查通过后才构建并推送镜像；检查失败即中止，latest 不会被更新。
#
# 镜像地址由 CNB 内置变量推导（CNB_DOCKER_REGISTRY + CNB_REPO_SLUG_LOWERCASE），
# Fork 仓库自动推送到它自己的制品库，不会指向上游仓库。

$:
  vscode:
    - name: goland-dev
      services:
        - vscode
        - docker

      docker:
        image: docker.cnb.cool/arthur-cloud-native/jetbrains/goland:5.0.1

      stages:
        - name: environment-check
          script: |
            go version
            git --version
            docker version
            docker compose version

  pull_request:
    - name: pr-check
      services:
        - docker
      docker:
        image: golang:1.24
        volumes:
          - /go/pkg/mod
          - /root/.cache/go-build
      stages:
        - name: check
          script: make ci
        - name: frontend-check
          script: make web-image

  push:
    - name: branch-ci
      services:
        - docker
      docker:
        image: golang:1.24
        volumes:
          - /go/pkg/mod
          - /root/.cache/go-build
      stages:
        - name: check
          script: make ci
        - name: frontend-check
          script: make web-image

# main / develop 上的 PR：只检查，不发布（发布只由 main 的 push 触发）。
"(main|develop)":
  pull_request:
    - name: pr-check
      services:
        - docker
      docker:
        image: golang:1.24
        volumes:
          - /go/pkg/mod
          - /root/.cache/go-build
      stages:
        - name: check
          script: make ci
        - name: frontend-check
          script: make web-image

develop:
  push:
    - name: develop-ci
      services:
        - docker
      docker:
        image: golang:1.24
        volumes:
          - /go/pkg/mod
          - /root/.cache/go-build
      stages:
        - name: check
          script: make ci
        - name: frontend-check
          script: make web-image

main:
  push:
    - name: release
      services:
        - docker
      docker:
        image: golang:1.24
        volumes:
          - /go/pkg/mod
          - /root/.cache/go-build
      stages:
        # 同一流水线内先检查再发布：任一检查失败都会中止后面的镜像构建与推送。
        - name: check
          script: make ci
        - name: build-and-push-images
          script: |
            set -euo pipefail

            version="$(tr -d '[:space:]' < VERSION)"
            if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "✗ VERSION 内容必须是 X.Y.Z，当前为 '${version}'" >&2
              exit 1
            fi
            if [ -z "${CNB_COMMIT_SHORT:-}" ] || [ -z "${CNB_REPO_SLUG_LOWERCASE:-}" ]; then
              echo "✗ 缺少 CNB 内置变量 CNB_COMMIT_SHORT / CNB_REPO_SLUG_LOWERCASE" >&2
              exit 1
            fi

            image="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            versioned="${image}:v${version}-${CNB_COMMIT_SHORT}"
            web_versioned="${image}:web-v${version}-${CNB_COMMIT_SHORT}"
            echo "镜像：${versioned} / ${web_versioned}（源码 ${CNB_COMMIT}）"

            printf '%s' "${CNB_TOKEN}" | docker login \
              --username "${CNB_TOKEN_USER_NAME}" \
              --password-stdin "${CNB_DOCKER_REGISTRY}"

            # 只构建一次；latest 由同一镜像 tag 派生，保证两个标签指向同一制品。
            docker build --pull -t "${versioned}" .
            docker build --pull -t "${web_versioned}" web

            # 两个镜像均在构建/测试完成后发布；凭证只在运行时注入。
            for artifact in "${versioned}" "${web_versioned}"; do
              docker run --rm --entrypoint /bin/sh "${artifact}" \
                -c 'test ! -e /app/.env && test ! -e /app/.git'
            done

            docker tag "${versioned}" "${image}:latest"
            docker tag "${web_versioned}" "${image}:web-latest"
            docker push "${versioned}"
            docker push "${web_versioned}"
            docker push "${image}:latest"
            docker push "${image}:web-latest"
            echo "✓ 已发布后端 ${versioned}"
            echo "✓ 已发布前端 ${web_versioned}"
